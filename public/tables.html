<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#142219"><title>BBQ Town Table Timers</title>
<style>
:root{--nav:#142219;--bg:#f2f5f1;--ink:#172018;--muted:#667269;--line:#d8e0d9;--green:#187947;--green-bg:#e7f5ec;--blue:#1769aa;--blue-bg:#e2f2ff;--yellow:#8a5a00;--yellow-bg:#ffd84d;--red:#b42318;--red-bg:#fee9e7}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif}button{font:inherit;touch-action:manipulation}.top{position:sticky;top:0;z-index:20;background:var(--nav);color:#fff;padding:max(12px,env(safe-area-inset-top)) 18px 13px;box-shadow:0 2px 12px #0003}.bar{max-width:1440px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:14px}.brand h1{margin:0;font-size:21px}.brand small{color:#bed1c3}.tools{display:flex;align-items:center;gap:9px}.top-btn{min-height:42px;border:1px solid #ffffff50;border-radius:22px;background:#ffffff13;color:white;padding:0 15px;font-weight:850;text-decoration:none;display:inline-flex;align-items:center}.top-btn.clear-all{background:#b42318;border-color:#d95b52}.clock{font-size:17px;font-weight:900;min-width:70px;text-align:right}main{max-width:1440px;margin:auto;padding:18px}.hero{display:flex;justify-content:space-between;align-items:end;gap:12px;margin-bottom:14px}.hero h2{font-size:28px;margin:0 0 4px}.hero p{margin:0;color:var(--muted)}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:15px}.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px 15px}.stat b{display:block;font-size:25px}.stat span{font-size:12px;color:var(--muted);font-weight:700}.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}.table{position:relative;min-height:174px;border:2px solid var(--line);border-radius:20px;background:#fff;padding:15px;text-align:left;color:var(--ink);cursor:pointer;box-shadow:0 3px 10px #1720180c;transition:transform .15s,box-shadow .15s,border-color .15s}.table:hover{transform:translateY(-2px);box-shadow:0 8px 20px #17201818}.table:active{transform:scale(.985)}.table-number{font-size:16px;font-weight:900}.time{font-variant-numeric:tabular-nums;font-size:35px;line-height:1.05;font-weight:950;margin:17px 0 8px;letter-spacing:-1px}.status{font-size:12px;font-weight:900;letter-spacing:.04em;text-transform:uppercase}.hint{font-size:12px;color:var(--muted);margin-top:7px;line-height:1.3}.idle{background:#fff}.running{border-color:#9ed2b2;background:var(--green-bg)}.running .status{color:var(--green)}.water{border-color:#63aee0;background:var(--blue-bg);box-shadow:0 0 0 4px #1769aa18,0 8px 22px #1769aa22;animation:waterPulse 1.4s ease-in-out infinite}.water .status{color:var(--blue)}.final{border-color:#e3a900;background:var(--yellow-bg);color:#3b2b00;animation:urgentFlash .8s ease-in-out infinite}.final .status,.final .hint{color:#5a3b00}.expired{border-color:var(--red);background:var(--red-bg)}.expired .status{color:var(--red)}.water-ok{position:absolute;right:12px;top:12px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:#fff;color:var(--green);font-weight:950}.sync{font-size:12px;color:var(--muted);margin-top:14px;text-align:right}.overlay{position:fixed;inset:0;z-index:50;background:#07120dcc;display:grid;place-items:center;padding:20px}.dialog{width:min(480px,100%);background:#fff;border-radius:22px;padding:24px;box-shadow:0 24px 70px #0005}.dialog h2{margin:0 0 8px;font-size:25px}.dialog p{color:var(--muted);line-height:1.5}.dialog-actions{display:grid;gap:9px;margin-top:18px}.dialog-actions button{min-height:54px;border-radius:12px;border:1px solid var(--line);background:#fff;font-weight:900}.dialog-actions .primary{background:var(--green);border-color:var(--green);color:#fff}.dialog-actions .danger{color:var(--red);border-color:#efb0aa}.toast{position:fixed;z-index:70;left:50%;bottom:25px;transform:translateX(-50%);background:var(--nav);color:#fff;padding:13px 18px;border-radius:12px;font-weight:850;box-shadow:0 8px 26px #0004}.hidden{display:none}@keyframes waterPulse{50%{box-shadow:0 0 0 8px #1769aa10,0 8px 25px #1769aa33}}@keyframes urgentFlash{50%{background:#fff3bf;box-shadow:0 0 0 5px #ffca2844}}@media(max-width:1050px){.grid{grid-template-columns:repeat(4,1fr)}}@media(max-width:760px){.grid{grid-template-columns:repeat(3,1fr)}.summary{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){.top{padding-left:12px;padding-right:12px}.brand small,.clock{display:none}.top-btn{padding:0 11px}.hero{align-items:flex-start;flex-direction:column}.hero h2{font-size:24px}.grid{grid-template-columns:repeat(2,1fr);gap:9px}.table{min-height:155px;padding:12px}.time{font-size:30px;margin-top:15px}main{padding:13px}}
</style></head><body>
<header class="top"><div class="bar"><div class="brand"><h1>BBQ TOWN</h1><small id="sub">20 Table Timers · Dickson</small></div><div class="tools"><button class="top-btn clear-all" id="clearAll">CLEAR ALL</button><a class="top-btn" href="/reservations.html" id="bookingLink">Reservations</a><a class="top-btn" href="/ops.html" id="opsLink">Buffet Ops</a><button class="top-btn" id="lang">中文</button><div class="clock" id="clock"></div></div></div></header>
<main><div class="hero"><div><h2 id="title">Table Timers</h2><p id="intro">Tap an empty table to start 90 minutes.</p></div></div><div class="summary" id="summary"></div><div class="grid" id="grid"></div><div class="sync" id="sync">Connecting…</div></main><div id="modal"></div><div id="toast" class="toast hidden"></div>
<script>
(()=>{'use strict';
const TOTAL=90*60, WATER=45*60, FINAL=10*60, KEY='bbqtown-table-timers-v1';
let lang=localStorage.getItem(KEY+'-lang')||'en', updatedAt=0, ready=false, hash='', saveTimer;
let tables=Array.from({length:20},(_,i)=>({id:i+1,startedAt:null,waterConfirmed:false,waterConfirmedAt:null})),logs=[];
const $=s=>document.querySelector(s), tx=(en,zh)=>lang==='zh'?zh:en, remaining=t=>t.startedAt===null?TOTAL:Math.max(0,TOTAL-Math.floor((Date.now()-t.startedAt)/1000));
function phase(t){if(t.startedAt===null)return'idle';let r=remaining(t);if(r<=0)return'expired';if(r<=FINAL)return'final';if(r<=WATER&&!t.waterConfirmed)return'water';return'running'}
function format(sec){return `${String(Math.floor(sec/60)).padStart(2,'0')}:${String(sec%60).padStart(2,'0')}`}
function log(action,t){logs.unshift({at:Date.now(),action,table:t.id});logs=logs.slice(0,500)}
function payload(){return{tables,logs}}function queueSave(){if(!ready)return;let next=JSON.stringify(payload());if(next===hash)return;clearTimeout(saveTimer);saveTimer=setTimeout(()=>push(next),120)}
async function push(serialized){try{let r=await fetch('/api/tables',{method:'POST',headers:{'content-type':'application/json'},body:serialized});if(!r.ok)throw Error();let d=await r.json();hash=serialized;updatedAt=d.updatedAt||Date.now();$('#sync').textContent=tx('Synced','已同步')}catch{$('#sync').textContent=tx('Sync retrying…','正在重新同步…')}}
async function load(){try{let d=await(await fetch('/api/tables',{cache:'no-store'})).json();ready=true;updatedAt=d.updatedAt||0;if(d.state?.tables?.length===20){tables=d.state.tables;logs=Array.isArray(d.state.logs)?d.state.logs:[];hash=JSON.stringify(payload())}else queueSave();render()}catch{$('#sync').textContent=tx('Database unavailable','数据库暂时不可用')}}
async function poll(){try{let d=await(await fetch('/api/tables',{cache:'no-store'})).json();if(d.updatedAt>updatedAt&&d.state?.tables?.length===20){updatedAt=d.updatedAt;tables=d.state.tables;logs=Array.isArray(d.state.logs)?d.state.logs:[];hash=JSON.stringify(payload());render()}}catch{}}
function render(){let counts={running:0,water:0,final:0,expired:0};tables.forEach(t=>{let p=phase(t);if(p!=='idle')counts[p]++});$('#summary').innerHTML=`<div class="stat"><b>${tables.filter(t=>t.startedAt!==null).length}</b><span>${tx('ACTIVE TABLES','正在计时')}</span></div><div class="stat"><b>${counts.water}</b><span>${tx('ADD WATER','需要加水')}</span></div><div class="stat"><b>${counts.final}</b><span>${tx('LAST 10 MIN','最后10分钟')}</span></div><div class="stat"><b>${counts.expired}</b><span>${tx('TIME UP','已到时间')}</span></div>`;$('#grid').innerHTML=tables.map(card).join('');document.querySelectorAll('[data-table]').forEach(b=>b.onclick=()=>tap(+b.dataset.table));$('#lang').textContent=lang==='zh'?'English':'中文';$('#sub').textContent=tx('20 Table Timers · Dickson','20桌计时器 · Dickson');$('#title').textContent=tx('Table Timers','桌台计时');$('#intro').textContent=tx('Tap an empty table to start 90 minutes.','点击空桌开始90分钟计时。');$('#opsLink').textContent=tx('Buffet Ops','自助餐运营');$('#clearAll').textContent=tx('CLEAR ALL','全部清台');queueSave()}
function card(t){let p=phase(t),r=remaining(t),status={idle:tx('READY','空桌'),running:t.waterConfirmed?tx('RUNNING · WATER DONE','计时中 · 已加水'):tx('RUNNING','计时中'),water:tx('💧 ADD WATER','💧 请加水'),final:tx('⚠ LAST 10 MINUTES','⚠ 最后10分钟'),expired:tx('TIME UP','已到时间')}[p],hint={idle:tx('Tap to start 90 min','点击开始90分钟'),running:t.waterConfirmed?tx('Water confirmed','已确认加水'):tx('Water reminder at 45:00','45:00 提醒加水'),water:tx('Tap after adding water','加水后点击桌台'),final:tx('Table is nearly finished','桌台即将到时'),expired:tx('Tap to clear table','点击清台')}[p];return `<button class="table ${p}" data-table="${t.id}">${t.waterConfirmed&&p!=='idle'?'<span class="water-ok">💧</span>':''}<div class="table-number">${tx('TABLE','桌台')} ${t.id}</div><div class="time">${t.startedAt===null?'90:00':format(r)}</div><div class="status">${status}</div><div class="hint">${hint}</div></button>`}
function tap(id){let t=tables.find(x=>x.id===id),p=phase(t);if(p==='idle'){t.startedAt=Date.now();t.waterConfirmed=false;t.waterConfirmedAt=null;log('90 MIN TIMER STARTED',t);render();toast(tx(`Table ${id} started`,`桌台 ${id} 已开始计时`));return}if(p==='water'){t.waterConfirmed=true;t.waterConfirmedAt=Date.now();log('WATER REFILL CONFIRMED',t);render();toast(tx(`Table ${id} water confirmed`,`桌台 ${id} 已确认加水`));return}if(p==='expired'){confirmDialog(t,true);return}confirmDialog(t,false)}
function confirmDialog(t,expired){$('#modal').innerHTML=`<div class="overlay"><div class="dialog"><h2>${tx('Table','桌台')} ${t.id}</h2><p>${expired?tx('The 90-minute service time has ended.','90分钟用餐时间已结束。'):tx('Choose an action for this table.','请选择这个桌台的操作。')}</p><div class="dialog-actions"><button class="primary" data-restart>${tx('Restart 90 Minutes','重新开始90分钟')}</button><button class="danger" data-clear>${tx('Clear Table','清空桌台')}</button><button data-cancel>${tx('Cancel','取消')}</button></div></div></div>`;$('#modal').querySelector('[data-cancel]').onclick=()=>$('#modal').innerHTML='';$('#modal').querySelector('[data-restart]').onclick=()=>{t.startedAt=Date.now();t.waterConfirmed=false;t.waterConfirmedAt=null;log('90 MIN TIMER RESTARTED',t);$('#modal').innerHTML='';render()};$('#modal').querySelector('[data-clear]').onclick=()=>{log('TABLE CLEARED',t);t.startedAt=null;t.waterConfirmed=false;t.waterConfirmedAt=null;$('#modal').innerHTML='';render()}}
function clearAllTables(){let active=tables.filter(t=>t.startedAt!==null).length;if(!active){toast(tx('All tables are already clear','所有桌台已经是空桌'));return}$('#modal').innerHTML=`<div class="overlay"><div class="dialog"><h2>${tx('Clear all tables?','全部清台？')}</h2><p>${tx(`This will stop all ${active} active table timers and reset every table to READY.`,`这会停止当前 ${active} 个桌台的计时，并将全部桌台重置为空桌。`)}</p><div class="dialog-actions"><button class="danger" data-clear-all>${tx('YES · CLEAR ALL TABLES','确认 · 全部清台')}</button><button data-cancel>${tx('Cancel','取消')}</button></div></div></div>`;$('#modal').querySelector('[data-cancel]').onclick=()=>$('#modal').innerHTML='';$('#modal').querySelector('[data-clear-all]').onclick=()=>{tables.forEach(t=>{if(t.startedAt!==null)log('TABLE CLEARED · BULK',t);t.startedAt=null;t.waterConfirmed=false;t.waterConfirmedAt=null});$('#modal').innerHTML='';render();toast(tx('All tables cleared','所有桌台已清空'))}}
function toast(s){let e=$('#toast');e.textContent=s;e.classList.remove('hidden');setTimeout(()=>e.classList.add('hidden'),1800)}
$('#clearAll').onclick=clearAllTables;$('#lang').onclick=()=>{lang=lang==='en'?'zh':'en';localStorage.setItem(KEY+'-lang',lang);render()};function clock(){let d=new Date();$('#clock').textContent=d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}clock();setInterval(clock,1000);setInterval(render,1000);setInterval(poll,2500);render();load();
})();
</script></body></html>
